
name: MiniPay CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  database-smoke-test:
    name: PostgreSQL schema and seed validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: minipay
          POSTGRES_PASSWORD: minipay_test_password
          POSTGRES_DB: minipay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minipay -d minipay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: minipay
      PGPASSWORD: minipay_test_password
      PGDATABASE: minipay

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Validate Python generator syntax
        run: python -m py_compile sql/generate_data.py

      - name: Apply database schema
        run: |
          psql -v ON_ERROR_STOP=1 -f sql/schema.sql

      - name: Generate synthetic data
        run: |
          python sql/generate_data.py > seed.sql

      - name: Load synthetic data
        run: |
          psql -v ON_ERROR_STOP=1 -f seed.sql

     
      - name: Verify database records
        run: |
          CUSTOMER_COUNT=$(psql -tA -c "SELECT COUNT(*) FROM customers")
          TRANSACTION_COUNT=$(psql -tA -c "SELECT COUNT(*) FROM transactions")

          echo "Customers found: $CUSTOMER_COUNT"
          echo "Transactions found: $TRANSACTION_COUNT"

          if [ "$CUSTOMER_COUNT" -ne 1000 ]; then
            echo "ERROR: Expected 1000 customers, found $CUSTOMER_COUNT"
            exit 1
          fi

          if [ "$TRANSACTION_COUNT" -ne 50000 ]; then
            echo "ERROR: Expected 50000 transactions, found $TRANSACTION_COUNT"
            exit 1
          fi

          echo "Database validation passed!"

        
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

   

      - name: Run database and API tests
        env:
          DATABASE_URL: postgresql+psycopg://minipay:minipay_test_password@localhost:5432/minipay
          PYTHONPATH: ${{ github.workspace }}
          MINIPAY_API_KEY: test-merchant-key
        run: |
          python -m pytest tests/api/ -v

